name: Publish Validated Images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cd-stable-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CI_RUN: ${{ github.event.workflow_run.id }}
      COMPOSE_PROJECT_NAME: dataquery-cd-release-${{ github.run_id }}-${{ github.run_attempt }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/cd/release.py gate
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: prepare
        run: python scripts/cd/release.py prepare
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.prepare.outputs.backend_tag }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cd-backend
          cache-to: type=gha,mode=max,scope=cd-backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.prepare.outputs.frontend_tag }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cd-frontend
          cache-to: type=gha,mode=max,scope=cd-frontend
      - run: python scripts/cd/release.py resolve
      - run: bash scripts/cd/validate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-diagnostics
          path: artifacts/cd-smoke.json
          retention-days: 7
      - run: python scripts/cd/release.py finalize
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.run_attempt }}
          path: artifacts/release.json
          retention-days: 90
          if-no-files-found: error
