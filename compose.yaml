name: dataquery-agent

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请配置数据库名}
      POSTGRES_USER: ${POSTGRES_USER:?请配置初始化账号}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置密码}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
