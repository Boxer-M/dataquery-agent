name: dataquery-lineage-v1
services:
  neo4j:
    image: neo4j:5.26-community@sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Use the ignored .env.neo4j file}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_db_transaction_timeout: 5s
    ports:
      - "127.0.0.1:7474:7474"
    mem_limit: 1g
    cpus: 1
    volumes:
      - lineage_data:/data
volumes:
  lineage_data:
